[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-question-bench"
version = "0.1.0"
description = "Offline synthetic FHIR question benchmark smoke slice"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fhir-question-bench = "fhir_question_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fhir_question_bench = ["data/*.jsonl", "data/**/*.json", "data/**/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
