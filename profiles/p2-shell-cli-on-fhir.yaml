id: p2-shell-cli-on-fhir
harness: copilot-cli
executable: copilot.exe
model: claude-sonnet-5.5
builtin_tools: [view, rg, glob, powershell, read_powershell, stop_powershell, apply_patch]
mcp_servers:
  fhir:
    command: "${FAB_CLI_ON_FHIR}"
    args: [mcp, "{corpus}", --cache-dir, "${FAB_CLI_ON_FHIR_CACHE}"]
    tools: [folder_inspect, folder_code_systems, search_fhir_resources, read_resources,
            patient_list, context_get_root, context_expand, context_find,
            terminology_list, terminology_lookup, terminology_search, terminology_validate_code,
            terminology_subsumes, terminology_navigate, terminology_expand, terminology_translate]
prompt_template: ../prompts/default.md
max_ai_credits: 30
timeout_minutes: 20
