id: p2-lean
harness: copilot-cli
executable: copilot.exe
model: claude-sonnet-5.5
builtin_tools: [view, rg, glob, powershell, read_powershell, stop_powershell, apply_patch]
mcp_servers:
  fhir:
    command: "${FAB_CLI_ON_FHIR}"
    args: [mcp, "{corpus}"]
    tools: [patient_list, search_fhir_resources, read_resources]
prompt_template: ../prompts/default.md
max_ai_credits: 30
timeout_minutes: 20
