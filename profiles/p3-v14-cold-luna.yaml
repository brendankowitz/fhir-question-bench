id: p3-v14-cold-luna
harness: copilot-cli
executable: copilot.exe
model: gpt-6-luna
builtin_tools: [create, apply_patch]
mcp_servers:
  fhir:
    command: "${FAB_CLI_ON_FHIR}"
    args: [mcp, "{corpus}", --cache-dir, "${FAB_CLI_ON_FHIR_CACHE}", --tx-server, "https://tx.fhir.org/r4", --rxclass-server, "https://rxnav.nlm.nih.gov/REST"]
    tools: [patient_summary, search_fhir_resources, patient_cohort, folder_code_systems,
            terminology, read_resources, help]
prompt_template: ../prompts/default.md
max_ai_credits: 30
timeout_minutes: 20
